name: Memory Director - Windows build and test

on:
  push:
    paths:
      - 'memory-director/**'
      - '.github/workflows/memory-director-windows.yml'
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate .NET Framework compiler
        shell: powershell
        run: |
          $candidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw "csc.exe .NET Framework non trovato" }
          "CSC=$csc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Compiler: $csc"

      - name: Compile console test executable
        shell: cmd
        run: >
          "%CSC%" /nologo /target:exe /optimize+
          /out:memory-director\MemoryDirector.Tests.exe
          /reference:System.Windows.Forms.dll
          /reference:System.Drawing.dll
          /reference:System.Web.Extensions.dll
          /reference:System.Speech.dll
          memory-director\MemoryDirector.cs

      - name: Run self-tests
        shell: cmd
        run: memory-director\MemoryDirector.Tests.exe --self-test

      - name: Compile Windows application
        shell: cmd
        run: >
          "%CSC%" /nologo /target:winexe /optimize+
          /out:memory-director\MemoryDirector.exe
          /reference:System.Windows.Forms.dll
          /reference:System.Drawing.dll
          /reference:System.Web.Extensions.dll
          /reference:System.Speech.dll
          memory-director\MemoryDirector.cs

      - name: Package release ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item memory-director\MemoryDirector.exe dist\MemoryDirector.exe
          Copy-Item memory-director\README.md dist\README.md
          Compress-Archive -Path dist\MemoryDirector.exe,dist\README.md -DestinationPath dist\MemoryDirector_Windows.zip -Force

      - name: Upload tested Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MemoryDirector-Windows-tested
          path: dist/MemoryDirector_Windows.zip
          if-no-files-found: error
