name: Smoke Test F1 Lead Intake

on:
  push:
    paths:
      - '.github/workflows/smoke-test-f1-lead-intake.yml'
      - 'strategies/real-estate-ads/edge/f1-lead-intake/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ENDPOINT: https://nqnmlsmeiynxbdojeyjt.supabase.co/functions/v1/f1-lead-intake
    steps:
      - name: GET landing is live
        run: |
          status=$(curl --silent --show-error --location --output landing.html --write-out '%{http_code}' "$ENDPOINT")
          echo "GET status=$status"
          if [ "$status" != "200" ]; then cat landing.html; exit 1; fi
          grep -q "Prima di comprare casa" landing.html
          grep -q "RICEVI IL CONTENUTO" landing.html
      - name: POST validation executes without storing a lead
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            --data '{"first_name":"","email":"not-an-email","phone":"1","consent_privacy":false}')
          echo "POST status=$status"
          if [ "$status" != "422" ]; then cat response.json; exit 1; fi
          grep -q 'required_fields' response.json
      - name: Reserved list rejects missing token
        run: |
          status=$(curl --silent --show-error --output reserved.json --write-out '%{http_code}' \
            "$ENDPOINT?view=reserved")
          echo "Reserved status=$status"
          if [ "$status" != "400" ]; then cat reserved.json; exit 1; fi
          grep -q 'missing_access' reserved.json
      - name: Full synthetic lead reaches CRM
        run: |
          EMAIL="f1-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PHONE="+39000${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          payload=$(printf '{"first_name":"TEST_AUTOMATICO","last_name":"DELETE_ME","email":"%s","phone":"%s","desired_area":"TEST_AUTOMATION","property_type":"Trilocale","budget_max":150000,"purchase_timing_days":365,"consent_privacy":true,"consent_marketing":false,"source":"integration-smoke"}' "$EMAIL" "$PHONE")
          status=$(curl --silent --show-error --output full.json --write-out '%{http_code}' -X POST "$ENDPOINT" -H 'Content-Type: application/json' --data "$payload")
          echo "Full POST status=$status"
          cat full.json
          test "$status" = "200"
          grep -q '"ok":true' full.json
          grep -q '"code":"guida-acquisto"' full.json
          grep -q 'F1_Guida_Acquisto_Casa_2026.pdf' full.json
