name: Real Estate Ads Engine

on:
  push:
    paths:
      - 'strategies/real-estate-ads/**'
      - '.github/workflows/real-estate-ads-engine.yml'
  pull_request:
    paths:
      - 'strategies/real-estate-ads/**'

jobs:
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategies/real-estate-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile ads_engine.py lead_magnet_engine.py test_ads_engine.py test_lead_magnet_engine.py
      - run: python -m pip install pytest
      - run: python -m pytest -q

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check strategies/real-estate-ads/edge/f1-lead-intake/index.ts
