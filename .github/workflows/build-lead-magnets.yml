name: Build F1 Lead Magnets

on:
  push:
    paths:
      - 'strategies/real-estate-ads/generate_lead_magnets.py'
      - '.github/workflows/build-lead-magnets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab
      - run: python strategies/real-estate-ads/generate_lead_magnets.py
      - name: Verify PDFs
        run: |
          test -s strategies/real-estate-ads/public/assets/F1_Guida_Acquisto_Casa_2026.pdf
          test -s strategies/real-estate-ads/public/assets/F1_Checklist_Prima_Casa_2026.pdf
      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strategies/real-estate-ads/public/assets/*.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes.'
          else
            git commit -m 'Regenerate F1 lead magnet PDFs'
            git push
          fi
